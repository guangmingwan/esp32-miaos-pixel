; ESP32-S3-WROOM-1-N16R8 (16MB QIO Flash + 8MB OPI PSRAM)
; Target board: Retro-Pixel (HD231005C10 / ILI9342, see retro-pixel-datasheet.md)

[env:esp32s3]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
framework = arduino, espidf
monitor_speed = 115200
board_build.sdkconfig_path = sdkconfig.esp32s3
board_build.partitions = partitions_dual.csv
build_flags =
    -DMIA_ESPIDF_APP_MAIN
    -DMIA_ENABLE_SD
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOG_TO_USB_CDC=1
lib_deps =
    adafruit/Adafruit GFX Library
    xreef/SimpleFTPServer
; USB MSC firmware removed — ota_1 is now dedicated app slot for OTA app partition mode.

; OTA test firmware (pure ESP-IDF, no Arduino, Task WDT disabled)
[env:esp32s3-otatest]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_dual.csv
build_flags =
    -Iinclude
build_src_filter = -<*> +<../test_ota_esp32s3/>
board_build.sdkconfig_path = sdkconfig.otatest
