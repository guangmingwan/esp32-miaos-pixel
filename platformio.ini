; ESP32-S3-WROOM-1-N16R8 (16MB QIO Flash + 8MB OPI PSRAM)
; Target board: Retro-Pixel (HD231005C10 / ILI9342, see retro-pixel-datasheet.md)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
framework = arduino, espidf
monitor_speed = 115200
board_build.partitions = partitions_dual.csv
build_flags =
    -DMIA_ESPIDF_APP_MAIN
    -DMIA_ENABLE_SD
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOG_TO_USB_CDC=1
lib_deps =
    adafruit/Adafruit GFX Library
    xreef/SimpleFTPServer
build_src_filter =
    -<apps/diagnostic_app.cpp>
    -<apps/screen_test_app.cpp>
    -<apps/flashlight_app.cpp>
    -<apps/timer_app.cpp>
    -<apps/wifi_files_app.cpp>
    -<apps/ftp_server_app.cpp>
    -<apps/wifi_scan_app.cpp>

; USB Disk firmware: pure Arduino framework, TinyUSB MSC, boots from ota_1
[env:esp32s3-usbmsc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_dual.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
build_src_filter = -<*> +<../src_usbmsc/> +<../src/lcd_ili9342.cpp> +<../src/lava_native_display.cpp>

; OTA test firmware (pure ESP-IDF, no Arduino, Task WDT disabled)
[env:esp32s3-otatest]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_dual.csv
build_flags =
    -Iinclude
build_src_filter = -<*> +<../test_ota_esp32s3/>
board_build.sdkconfig_path = sdkconfig.otatest
